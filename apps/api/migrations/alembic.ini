# Alembic config. URL comes from platform config (APP_DATABASE_URL).
[alembic]
script_location = %(here)s
path_separator = os
version_path_separator = os
# Source roots are added in env.py rather than here: `prepend_sys_path` is a
# single separator-delimited value, and paths depend on sys.platform, which
# an .ini file cannot express.
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
