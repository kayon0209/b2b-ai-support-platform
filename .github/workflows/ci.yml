name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8,<0.9"
      # `scripts`, `tests` and the release-gate pytest plugin are linted too.
      # Leaving them out was how a whole tree - including the plugin that
      # produces release evidence - stayed outside the style gate.
      - run: ruff check apps packages scripts tests pytest_plugins_release
      - run: ruff format --check apps packages scripts tests pytest_plugins_release

  typecheck:
    # mypy strict is clean across the source roots (see [tool.mypy] in
    # pyproject.toml). It was enforced by convention only; a convention that
    # is not a CI job is one that decays silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Typecheck
        run: mypy

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install detect-secrets
      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files '\.venv' \
            --exclude-files '\.lock$' \
            --exclude-files 'package-lock\.json$' \
            > .secrets.baseline.new
          python - <<'EOF'
          import json, sys
          with open(".secrets.baseline.new") as f:
              results = json.load(f)["results"]
          if results:
              print("Potential secrets detected:", json.dumps(results, indent=2)[:4000])
              sys.exit(1)
          print("No secrets found")
          EOF

  dependency-scan:
    # Known-vulnerability scan. Deliberately a *gate*: a new advisory on a
    # pinned dependency should stop the pipeline, not appear as a warning
    # nobody reads. `--strict` makes pip-audit fail on any advisory,
    # including ones with no fix available, so a transitive CVE cannot be
    # silently inherited.
    #
    # Audits the *installed* environment rather than `-r requirements.txt`.
    # Both work, but `-r` makes pip-audit re-resolve the whole dependency
    # graph against PyPI on every run, which is slow and - measured locally -
    # can hang indefinitely behind a slow index. Auditing what was actually
    # installed is faster and is also the stronger statement: it covers
    # transitive dependencies that no manifest names.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off --desc
      - name: Audit admin-web dependencies
        working-directory: apps/admin-web
        run: npm audit --audit-level=high

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install fastapi "sqlalchemy[asyncio]" "psycopg[binary]" pydantic pydantic-settings uuid6 alembic pytest pytest-asyncio httpx
      - name: Run unit tests
        run: pytest apps/api/tests/unit packages/contracts/tests -m "not integration"
        env:
          PYTHONPATH: apps/api/src:packages/contracts/src

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start services
        run: docker compose -f infra/compose/docker-compose.yml up -d ai-postgres ai-redis
      - name: Create app role
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T ai-postgres \
            psql -U platform -d platform -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'platform_app') THEN
                 CREATE ROLE platform_app LOGIN PASSWORD 'platform_app' NOBYPASSRLS;
               END IF;
             END \$\$;
             GRANT platform_app TO platform;
             GRANT ALL ON SCHEMA public TO platform_app;"
      - name: Install dependencies
        run: pip install fastapi "sqlalchemy[asyncio]" "psycopg[binary]" pydantic pydantic-settings uuid6 alembic pytest pytest-asyncio httpx
      - name: Run migrations
        run: alembic -c apps/api/migrations/alembic.ini upgrade head
        env:
          APP_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5435/platform
          PYTHONPATH: apps/api/src
      - name: Run integration tests
        run: pytest apps/api/tests/integration -m integration
        env:
          APP_TEST_DATABASE_URL: postgresql+psycopg://platform_app:platform_app@localhost:5435/platform
          APP_ADMIN_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5435/platform
          PYTHONPATH: apps/api/src

  release-evidence:
    # Verifies the evidence behind the zero-tolerance release gates.
    #
    # This is deliberately *not* `release_check` in full. Two of its inputs -
    # the evaluation report and read-tool telemetry - are release-time
    # artifacts that need a real tenant corpus and production traffic, so a
    # CI job that demanded them would be permanently red and would train
    # people to ignore it. What CI can honestly prove is the other failure:
    # a zero-tolerance suite silently dropping out of collection, which would
    # otherwise make the release gate report zero violations because nothing
    # was watching.
    #
    # It runs the *whole* suite rather than `-m integration`, because the
    # `unauthorized_writes` invariant is backed by unit tests - an
    # integration-only run would leave that count unmeasured.
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start services
        run: docker compose -f infra/compose/docker-compose.yml up -d ai-postgres ai-redis
      - name: Create app role
        run: |
          docker compose -f infra/compose/docker-compose.yml exec -T ai-postgres \
            psql -U platform -d platform -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'platform_app') THEN
                 CREATE ROLE platform_app LOGIN PASSWORD 'platform_app' NOBYPASSRLS;
               END IF;
             END \$\$;
             GRANT platform_app TO platform;
             GRANT ALL ON SCHEMA public TO platform_app;"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        run: alembic -c apps/api/migrations/alembic.ini upgrade head
        env:
          APP_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5435/platform
          PYTHONPATH: apps/api/src
      - name: Run the full suite (produces the release-gate evidence)
        run: pytest
        env:
          APP_TEST_DATABASE_URL: postgresql+psycopg://platform_app:platform_app@localhost:5435/platform
          APP_ADMIN_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5435/platform
          PYTHONPATH: apps/api/src:apps/worker/src:packages/contracts/src:packages/policy/src:packages/observability/src
      - name: Verify the zero-tolerance evidence is complete
        run: python -m platform_core.evaluation.release_check --evidence-only
        env:
          PYTHONPATH: apps/api/src:apps/worker/src:packages/contracts/src:packages/policy/src:packages/observability/src
