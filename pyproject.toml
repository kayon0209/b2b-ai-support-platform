[project]
name = "b2b-ai-support"
version = "0.1.0"
description = "Enterprise AI customer support platform with owned customer channels and a FastAPI control plane"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "detect-secrets>=1.5",
]

[tool.ruff]
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S110"]
"**/tests/**" = ["S105", "S106", "S107", "S110"]
# retrieval/hybrid.py: SQL f-string interpolates only the code-owned
# space_filter constant; every value is a bound parameter.
"apps/api/src/platform_core/retrieval/hybrid.py" = ["S608"]
# negative suite builds DELETE/SELECT from a code-owned table list
"apps/api/tests/integration/test_cross_tenant_negative.py" = ["S608"]
# 0053 interpolates TABLE/COLUMN into an UPDATE. Both are module-level string
# literals (`"tenants"`, `"brand_display_name"`), not caller input, and the
# interpolation is unavoidable: Postgres cannot bind an identifier as a
# parameter, so there is no parameterised form of this statement to prefer.
# A migration is also not request-handling code - it runs once, from a deploy.
"apps/api/migrations/versions/0053_brand_display_name_cleanup.py" = ["S608"]
# channels/wechat.py needs both of these, and neither is avoidable:
#   S324 sha1 is *mandated* by the WeChat Official Account protocol for its
#        server-URL signature. It signs a shared token plus a public
#        timestamp/nonce, not content, and no other digest is accepted.
#   S314 the XML body is parsed only after the signature has been verified, and
#        DOCTYPE/ENTITY declarations are refused before parsing - which closes
#        the known classes (billion laughs, XXE, quadratic blowup) that this
#        rule warns about. `defusedxml` is not a declared dependency here.
"apps/api/src/platform_core/channels/wechat.py" = ["S314", "S324"]
# The channel test computes WeChat's sha1 signature *independently* of the
# adapter, on purpose: calling the adapter's own helper would make the test agree
# with the code by construction, and a wrong sort order would pass. The
# algorithm is fixed by the protocol, so there is nothing to strengthen.
"apps/api/tests/integration/test_channel_webhooks.py" = ["S324"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/src", "apps/worker/src", "packages/contracts/src", "packages/policy/src", "packages/observability/src"]
explicit_package_bases = true
files = [
    "apps/api/src",
    "apps/worker/src",
    "packages/contracts/src",
    "packages/policy/src",
    "packages/observability/src",
]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "uuid6.*"]
ignore_missing_imports = true

# OpenTelemetry is an optional runtime extra (imported lazily and guarded by
# try/except ImportError in observability_tracing). It is not installed in the
# dev/test environment, so its stubs cannot be resolved; treat the imports as
# Any rather than failing the type gate on an optional dependency.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# `lxml` and `signxml` ship no stubs. SILENCE TYPES HERE, NOT ERRORS: the
# thing that proves the SAML verifier works is its test suite, which signs
# real documents and asserts 20-odd refusals - not a type checker reading
# untyped XML APIs and inferring nothing.
[[tool.mypy.overrides]]
module = ["lxml.*", "signxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Source roots for the modular monolith. Declared here rather than relying on
# an editable install so a fresh checkout runs the suite with nothing but
# `pip install -r requirements-dev.txt` and `pytest`.
pythonpath = [
    "apps/api/src",
    "apps/worker/src",
    "packages/policy/src",
    "packages/contracts/src",
    "packages/observability/src",
    ".",
]
# `tests` rather than `tests/evals`: the comment below describes the suite as
# having two test roots, but only the evals subtree was listed, so every test
# under `tests/unit` - the Huaqiu seed guard and the worker dispatch tests -
# was collected by nothing and ran only when named explicitly. `tests/e2e/*`
# is not collected by the file-name convention (they are scripts, not test
# modules), so widening the root does not pull them in.
testpaths = ["apps/api/tests", "packages/contracts/tests", "tests"]
# Loaded explicitly rather than as a conftest: the suite has two test roots
# (`apps/api/tests` and `tests/`), so a conftest at either one is not an
# ancestor of the other, and the release-gate evidence collector must see
# every zero-tolerance test in the session.
addopts = "-q --strict-markers -p pytest_plugins_release.gate_evidence"
markers = [
    "integration: requires docker-compose services",
    "contract: schema contract tests",
    "eval: LLM evaluation dataset and release gates",
    "zero_tolerance(name): a test whose pass is the evidence for a release gate's zero-tolerance count",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
