[project]
name = "b2b-ai-support"
version = "0.1.0"
description = "Enterprise AI customer support platform (Chatwoot kernel + FastAPI control plane)"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "detect-secrets>=1.5",
]

[tool.ruff]
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S110"]
"**/tests/**" = ["S105", "S106", "S107", "S110"]
# retrieval/hybrid.py: SQL f-string interpolates only the code-owned
# space_filter constant; every value is a bound parameter.
"apps/api/src/platform_core/retrieval/hybrid.py" = ["S608"]
# negative suite builds DELETE/SELECT from a code-owned table list
"apps/api/tests/integration/test_cross_tenant_negative.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/src", "apps/worker/src", "packages/contracts/src", "packages/policy/src", "packages/observability/src"]
explicit_package_bases = true
files = [
    "apps/api/src",
    "apps/worker/src",
    "packages/contracts/src",
    "packages/policy/src",
    "packages/observability/src",
]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "uuid6.*"]
ignore_missing_imports = true

# OpenTelemetry is an optional runtime extra (imported lazily and guarded by
# try/except ImportError in observability_tracing). It is not installed in the
# dev/test environment, so its stubs cannot be resolved; treat the imports as
# Any rather than failing the type gate on an optional dependency.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# `lxml` and `signxml` ship no stubs. SILENCE TYPES HERE, NOT ERRORS: the
# thing that proves the SAML verifier works is its test suite, which signs
# real documents and asserts 20-odd refusals - not a type checker reading
# untyped XML APIs and inferring nothing.
[[tool.mypy.overrides]]
module = ["lxml.*", "signxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Source roots for the modular monolith. Declared here rather than relying on
# an editable install so a fresh checkout runs the suite with nothing but
# `pip install -r requirements-dev.txt` and `pytest`.
pythonpath = [
    "apps/api/src",
    "apps/worker/src",
    "packages/policy/src",
    "packages/contracts/src",
    "packages/observability/src",
    ".",
]
testpaths = ["apps/api/tests", "packages/contracts/tests", "tests/evals"]
# Loaded explicitly rather than as a conftest: the suite has two test roots
# (`apps/api/tests` and `tests/`), so a conftest at either one is not an
# ancestor of the other, and the release-gate evidence collector must see
# every zero-tolerance test in the session.
addopts = "-q --strict-markers -p pytest_plugins_release.gate_evidence"
markers = [
    "integration: requires docker-compose services",
    "contract: schema contract tests",
    "eval: LLM evaluation dataset and release gates",
    "zero_tolerance(name): a test whose pass is the evidence for a release gate's zero-tolerance count",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
