# Kustomization: apply order and the files that are not applied.
#
# `kubectl apply -k` sorts by kind, which already puts Namespace before
# workloads, but `dependsOn` in Kustomize does not survive into the manifests
# and kubectl apply has no readiness concept. So the ordering that actually
# matters - the migration Job completes before the Deployments roll - is
# enforced by the apply procedure in the README, not by this file. Saying that
# here is better than a comment claiming an ordering guarantee this file does
# not provide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: b2b-support
resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-migrate-job.yaml
  - 30-api.yaml
  - 40-workers.yaml
  - 50-networkpolicy.yaml
  - 60-ingress.yaml
  # `70`/`71` are the Prometheus Operator CRDs. They need the operator's CRDs
  # installed, which this repository does not own - so they are listed, and
  # `test_kubernetes_manifests.py` asserts that, but applying them to a cluster
  # without the operator fails with "no matches for kind". That failure is
  # correct and better than the alternative: an operator installed without
  # rules looks exactly like a healthy deployment, because nothing is watching
  # the metrics.
  - 70-alerts.yaml
  - 71-servicemonitor.yaml
  # Scheduled work. The backup writes to a bucket that is not the one the
  # platform serves, because the documents bucket must stay unversioned for
  # retention's erasure to mean anything - see 80-backup-cronjob.yaml, which
  # carries the measurement that establishes it.
  - 80-backup-cronjob.yaml
  - 81-backup-drill-cronjob.yaml
# `11-secret.example.yaml` is intentionally absent: it holds placeholders, and
# applying it would create a Secret whose values look configured. Create the
# real Secret from your secret manager first.
#
# The image tag is pinned here rather than left to `latest`: a rollout must be
# a decision, and `kubectl set image` is what makes one.
images:
  - name: registry.example.com/b2b-support/platform
    newTag: REPLACE_ME_TAG
