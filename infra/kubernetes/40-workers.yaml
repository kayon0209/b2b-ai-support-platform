apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker-sla
  namespace: b2b-support
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: worker-sla
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/component: worker-sla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/component: worker-sla
    spec:
      serviceAccountName: platform
      # Above the 60-second sweep interval, so a rollout does not interrupt a
      # sweep halfway and leave a tenant unswept until the next cycle.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
