# Secret template. NOT a secret, and not applied by the kustomization.
#
# Every value here is a placeholder. The intended production path is an
# external secret manager (External Secrets Operator, Sealed Secrets, or the
# cloud provider's CSI driver) syncing into a Secret named `platform-secrets`.
# This file exists so the required *shape* is written down and a deployment
# cannot half-configure itself and fail on the first request instead of at
# startup.
#
# The `stringData` values are deliberately obvious nonsense rather than
# plausible strings: a placeholder that looks like a key is one somebody
# copies into a live cluster.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: b2b-support
type: Opaque
stringData:
  # Must match the password embedded in APP_DATABASE_URL in the ConfigMap. The
  # URL is split across the two objects because the password cannot live in a
  # ConfigMap; the migration Job composes the owner URL from both.
  APP_DATABASE_PASSWORD: "REPLACE_ME_db_password"
  # Signs webhook payloads and session state. Rotating it invalidates
  # outstanding signatures, which is the intended effect.
  APP_SECRET_KEY: "REPLACE_ME_64_hex_chars"
  APP_CHATWOOT_API_TOKEN: "REPLACE_ME_chatwoot_token"
  APP_CHATWOOT_WEBHOOK_SECRET: "REPLACE_ME_chatwoot_webhook_secret"
  APP_LLM_API_KEY: "REPLACE_ME_llm_key"
  APP_OBJECT_STORAGE_ACCESS_KEY: "REPLACE_ME_access_key"
  APP_OBJECT_STORAGE_SECRET_KEY: "REPLACE_ME_secret_key"
---
# Migration owner credentials, used ONLY by the migration Job.
#
# A separate Secret rather than another key in `platform-secrets`: the owner
# role is a superuser that bypasses row-level security, and a plaintext
# superuser URL sitting in the API's Secret is one `kubectl exec` away from
# being used by application code. Keeping it in its own object means the API's
# Secret can be read by an operator debugging a request without handing them
# the role that can read every tenant.
apiVersion: v1
kind: Secret
metadata:
  name: platform-migration-owner
  namespace: b2b-support
type: Opaque
stringData:
  APP_ADMIN_DATABASE_URL: "postgresql+psycopg://platform:REPLACE_ME@postgres-primary.b2b-support.svc.cluster.local:5432/platform"
