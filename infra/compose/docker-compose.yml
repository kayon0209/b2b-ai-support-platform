name: b2b-ai-support

services:
  # --- Custom AI platform (separate DB and Redis from Chatwoot, ADR-0001) ---
  ai-postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5435:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      ai-postgres:
        condition: service_healthy

  ai-api:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      APP_CHATWOOT_WEBHOOK_SECRET: local-dev-webhook-secret
      APP_CHATWOOT_BASE_URL: http://chatwoot-web:3000
    ports:
      - "8000:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # --- Chatwoot support kernel (upstream, separate storage) ---
  chatwoot-postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DB: chatwoot
    ports:
      - "5434:5432"
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-web:
    image: docker.1ms.run/chatwoot/chatwoot:latest
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: 3f8a1c9d2e7b4a6f8d0c2e4b6a8d0f2h4j6l8n0p2r4t6v8x0z2b4d6f8h1j3l
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot
      REDIS_URL: redis://chatwoot-redis:6379/0
      NODE_ENV: production
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

  chatwoot-sidekiq:
    image: docker.1ms.run/chatwoot/chatwoot:latest
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: 3f8a1c9d2e7b4a6f8d0c2e4b6a8d0f2h4j6l8n0p2r4t6v8x0z2b4d6f8h1j3l
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot
      REDIS_URL: redis://chatwoot-redis:6379/0
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

volumes:
  ai_postgres_data:
  ai_redis_data:
  minio_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
