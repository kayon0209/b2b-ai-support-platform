name: b2b-ai-support

services:
  # --- Custom AI platform (separate DB and Redis from Chatwoot, ADR-0001) ---
  ai-postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5435:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      ai-postgres:
        condition: service_healthy

  ai-api:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      APP_CHATWOOT_WEBHOOK_SECRET: local-dev-webhook-secret
      APP_CHATWOOT_BASE_URL: http://chatwoot-web:3000
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://ai.gitee.com/v1}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen3.8-flash}
    ports:
      - "8000:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # Customer-visible AI work: InboxEvent -> agent run. Same image as the
  # API, different entrypoint (docs/deployment-and-operations.md worker
  # classes). Runs against the AI database and the AI Redis only.
  #
  # APP_CHATWOOT_API_TOKEN is required here and NOT optional: the orchestrator
  # treats a missing sender as "un-sent, not failed", so a worker without a
  # token would consume real customer messages and reply to nobody while
  # reporting success. worker.wiring fails closed on this.
  ai-worker-interactive:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      APP_CHATWOOT_BASE_URL: http://chatwoot-web:3000
      APP_CHATWOOT_API_TOKEN: ${APP_CHATWOOT_API_TOKEN:-}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://ai.gitee.com/v1}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen3.8-flash}
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # Bulk work: parsing, chunking, embedding. Lowest priority, so it can
  # never starve interactive work (evaluation.queues reservation model).
  ai-worker-ingestion:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://ai.gitee.com/v1}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen3.8-flash}
      APP_WORKER_QUEUE: ingestion
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # Applies the tenant retention policy on a long interval (superseded
  # versions -> expired, resolved dead letters and completed inbox events
  # pruned). No LLM key: it touches no external system.
  ai-worker-retention:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_SECRET_KEY: local-dev-secret
      APP_WORKER_QUEUE: retention
    depends_on:
      ai-postgres:
        condition: service_healthy

  # Scans for breached SLA clocks and walks the escalation ladder. Its own
  # process because the interval is short (a minute, so a level-2 breach is
  # notified while it is still actionable) and a sweep on that cadence must
  # not share a poll loop with customer-facing work.
  ai-worker-sla:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_SECRET_KEY: local-dev-secret
      APP_WORKER_QUEUE: sla
    depends_on:
      ai-postgres:
        condition: service_healthy

  # Relays committed outbox events to their consumers. Runs without an LLM
  # key because delivering business events is independent of the AI path --
  # that is why it is its own service rather than bundled with the worker.
  ai-worker-outbox:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    command: ["python", "-m", "worker.runner", "--outbox-only"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # --- Chatwoot support kernel (upstream, separate storage) ---
  chatwoot-postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DB: chatwoot
    ports:
      - "5434:5432"
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatwoot-web:
    image: docker.1ms.run/chatwoot/chatwoot:latest
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: 3f8a1c9d2e7b4a6f8d0c2e4b6a8d0f2h4j6l8n0p2r4t6v8x0z2b4d6f8h1j3l
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot
      REDIS_URL: redis://chatwoot-redis:6379/0
      NODE_ENV: production
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

  chatwoot-sidekiq:
    image: docker.1ms.run/chatwoot/chatwoot:latest
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: 3f8a1c9d2e7b4a6f8d0c2e4b6a8d0f2h4j6l8n0p2r4t6v8x0z2b4d6f8h1j3l
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://chatwoot:chatwoot@chatwoot-postgres:5432/chatwoot
      REDIS_URL: redis://chatwoot-redis:6379/0
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

volumes:
  ai_postgres_data:
  ai_redis_data:
  minio_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
