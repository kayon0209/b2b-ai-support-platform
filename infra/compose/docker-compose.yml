name: b2b-ai-support

services:
  # --- Custom AI platform (its own database, Redis and object storage) ---
  ai-postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5435:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc` is not in the server image - the probe failed with ExitCode -1
      # ("executable file not found in $PATH") on every attempt, so MinIO
      # reported `unhealthy` for 14016 consecutive checks while serving
      # normally. A healthcheck that can never pass is worse than none: it
      # trains everyone to read the red line as normal, and any future
      # `depends_on: condition: service_healthy` would hang forever.
      # `curl` is present in this image and this endpoint is MinIO's own
      # liveness probe.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      ai-postgres:
        condition: service_healthy

  ai-api:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    image: b2b-ai-support-ai-api  # named so the workers can reuse this exact image
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      # Same class of remap as the two above, and it was missing: the setting
      # defaults to `localhost:9000`, which inside this container is the
      # container itself. Document upload failed with
      # `STORAGE_UNAVAILABLE ... ConnectError` while MinIO was healthy and
      # serving - the bug was the address, not the service. `.env` cannot fix
      # this: it holds host-facing addresses (localhost:5435, localhost:6380)
      # that are equally wrong in here, which is why this block exists.
      APP_OBJECT_STORAGE_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      # Not a correctness requirement - a storage failure returns 503 rather
      # than corrupting anything - but without it a cold start has a window
      # where uploads fail on an endpoint that is merely not up yet. The
      # healthcheck above is what makes this condition mean something.
      minio:
        condition: service_healthy

  # Customer-visible AI work: InboxEvent -> agent run. Same image as the
  # API, different entrypoint (docs/deployment-and-operations.md worker
  # classes). Runs against the AI database and the AI Redis only.
  #
  # Outbound delivery needs at least one channel transport (ADR 0014). A worker
  # with none would consume real customer messages and reply to nobody while
  # reporting success - the `worker_cannot_send` shape - so `worker.wiring`
  # refuses to start when the deployment asks for outbound capability.
  ai-worker-interactive:
    # Reuses the image `ai-api` builds. Building it a second time
    # produced a second image that silently drifted from the API's:
    # a fix present in ai-api was absent from every worker.
    image: b2b-ai-support-ai-api
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

  # Bulk work: parsing, chunking, embedding. Lowest priority, so it can
  # never starve interactive work (evaluation.queues reservation model).
  ai-worker-ingestion:
    # Reuses the image `ai-api` builds. Building it a second time
    # produced a second image that silently drifted from the API's:
    # a fix present in ai-api was absent from every worker.
    image: b2b-ai-support-ai-api
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
      APP_WORKER_QUEUE: ingestion
      # The ingest pipeline reads the stored original to parse it
      # (`ingestion_consumer.service.get_object`), so this worker needs the
      # same in-network address the API does. It was missing here too, and
      # the failure was worse than the API's: the read raised, the consumer
      # classified it `_Retryable` and released the claim, so the document sat
      # at `uploaded` and every document was retried forever - the knowledge
      # base was silently unusable for retrieval while upload looked fine.
      APP_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Applies the tenant retention policy on a long interval (superseded
  # versions -> expired, resolved dead letters and completed inbox events
  # pruned). No LLM key: it touches no external system.
  ai-worker-retention:
    # Reuses the image `ai-api` builds. Building it a second time
    # produced a second image that silently drifted from the API's:
    # a fix present in ai-api was absent from every worker.
    image: b2b-ai-support-ai-api
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_SECRET_KEY: local-dev-secret
      APP_WORKER_QUEUE: retention
    depends_on:
      ai-postgres:
        condition: service_healthy

  # Scans for breached SLA clocks and walks the escalation ladder. Its own
  # process because the interval is short (a minute, so a level-2 breach is
  # notified while it is still actionable) and a sweep on that cadence must
  # not share a poll loop with customer-facing work.
  ai-worker-sla:
    # Reuses the image `ai-api` builds. Building it a second time
    # produced a second image that silently drifted from the API's:
    # a fix present in ai-api was absent from every worker.
    image: b2b-ai-support-ai-api
    command: ["python", "-m", "worker.runner"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_SECRET_KEY: local-dev-secret
      APP_WORKER_QUEUE: sla
    depends_on:
      ai-postgres:
        condition: service_healthy

  # Relays committed outbox events to their consumers. Runs without an LLM
  # key because delivering business events is independent of the AI path --
  # that is why it is its own service rather than bundled with the worker.
  ai-worker-outbox:
    # Reuses the image `ai-api` builds. Building it a second time
    # produced a second image that silently drifted from the API's:
    # a fix present in ai-api was absent from every worker.
    image: b2b-ai-support-ai-api
    command: ["python", "-m", "worker.runner", "--outbox-only"]
    # The full environment, not a hand-listed subset. The API container
    # previously enumerated its own variables and omitted the auth config,
    # so it exited at startup with 'no authentication configured' even
    # against a correctly filled .env. `required: false` keeps a fresh
    # checkout working before .env exists.
    env_file:
      - path: ../../.env
        required: false
    # Explicit values below win over env_file, and exist to repoint the
    # services at their in-network addresses.
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://platform:platform@ai-postgres:5432/platform
      APP_REDIS_URL: redis://ai-redis:6379/0
      APP_SECRET_KEY: local-dev-secret
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy

volumes:
  ai_postgres_data:
  ai_redis_data:
  minio_data:
